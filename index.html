<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap');

    :root {
        /* PRAVO, JAKO ZLATO */
        --gold-solid: #FFD700; 
        --gold-light: #FFF8B0;
        --gold-dark: #DAA520;
        
        /* ČISTA CRNA POZADINA */
        --bg-dark: #000000;
        --card-black: #0A0A0A;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        background-image: none; /* Uklonjen braon preliv */
        font-family: 'Montserrat', sans-serif;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .company-logo {
        max-width: 250px;
        height: auto;
        margin-bottom: 10px;
        filter: drop-shadow(0px 4px 10px rgba(255, 215, 0, 0.4)); /* Zlatni sjaj oko logotipa */
    }

    .subtitle {
        font-size: 0.8rem;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--gold-solid);
        margin-top: 5px;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    #game-board {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 20px;
        max-width: 1200px;
    }

    /* Karte - čisto crne sa zlatnim ivicama */
    .card {
        width: 80px;
        height: 120px;
        background-color: var(--card-black);
        border: 1px solid rgba(255, 215, 0, 0.4);
        border-radius: 8px;
        position: relative;
        box-shadow: 0 4px 8px rgba(0,0,0,0.9), inset 0 0 10px rgba(255, 215, 0, 0.1);
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        user-select: none;
        overflow: hidden;
    }

    /* Sjajni zlatni okvir na hover */
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0,0,0,1), 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.3);
        border-color: var(--gold-solid);
    }

    .card-content {
        position: absolute;
        top: 5px;
        left: 8px;
        font-family: 'Cinzel', serif;
        font-weight: bold;
        font-size: 1.2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--gold-solid);
    }

    .card-suit {
        font-size: 1.3rem;
        margin-top: 2px;
    }

    /* Simboli u jakoj zlatnoj boji */
    .suit-hearts, .suit-diamonds, .suit-spades, .suit-clubs {
        background: linear-gradient(45deg, #FFF8B0, #FFD700, #DAA520);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0px 0px 2px rgba(255, 215, 0, 0.8));
    }

    .card-bottom {
        position: absolute;
        bottom: 5px;
        right: 8px;
        font-family: 'Cinzel', serif;
        font-weight: bold;
        font-size: 1.2rem;
        transform: rotate(180deg);
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--gold-solid);
    }

    .card-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3.5rem;
        opacity: 0.2;
    }

    .card-back {
        background: repeating-linear-gradient(
            45deg,
            #000,
            #000 10px,
            #111 10px,
            #111 20px
        );
        border: 2px solid var(--gold-dark);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-back-logo {
        font-family: 'Cinzel', serif;
        font-size: 2rem;
        font-weight: bold;
        color: var(--gold-solid);
        opacity: 0.6;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .column {
        display: flex;
        flex-direction: column;
        min-height: 400px;
        width: 90px; 
    }

    .card.stacked {
        margin-top: -90px; 
    }

    .controls {
        margin-top: 20px;
        margin-bottom: 50px;
        display: flex;
        gap: 20px;
    }

    button {
        background: transparent;
        color: var(--gold-solid);
        border: 2px solid var(--gold-solid);
        padding: 12px 30px;
        font-size: 1rem;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    button:hover {
        background: var(--gold-solid);
        color: #000;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        transform: scale(1.05);
    }

    .win-message {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.95);
        padding: 40px;
        border: 2px solid var(--gold-solid);
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
        z-index: 100;
    }

    .win-message h2 {
        font-family: 'Cinzel', serif;
        font-size: 2rem;
        margin-top: 0;
        color: var(--gold-solid);
    }
</style>
